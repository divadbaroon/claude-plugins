[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-compact-focus"
version = "0.22.2"
description = "Human-reviewed, recoverable compaction for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Hudson Mitchell-Pullman"},
]
keywords = ["claude-code", "codex", "compaction", "context", "human-in-the-loop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/divadbaroon/claude-plugins/tree/main/compact-focus"
Repository = "https://github.com/divadbaroon/claude-plugins"

[project.scripts]
compact-focus = "compact_focus.cli:main"
cf = "compact_focus.cli:main"

[tool.setuptools]
packages = ["compact_focus"]
