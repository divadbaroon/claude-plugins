[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-compact"
version = "0.20.2"
description = "Session-scoped goal workspaces and persistent context for Claude Code."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pypdf>=5,<7", "pyarrow>=18,<24", "openpyxl>=3.1,<4", "defusedxml>=0.7,<1"]
authors = [{ name = "David Baroon" }]
license = { text = "MIT" }

[project.optional-dependencies]
web = ["playwright>=1.50,<2"]

[project.scripts]
hc-backup = "human_compact.cli:main"
hc = "human_compact.cli:hc_main"
bart = "human_compact.cli:bart_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
human_compact = ["assets/**/*", "assets/plugin/.claude-plugin/*", "assets/bart-skill/*", "trajectory/web/*", "trajectory/web/static/*", "trajectory/web/goal/*", "trajectory/web/goal/components/*", "trajectory/web/goal/test/*", "trajectory/web/starter/*"]
