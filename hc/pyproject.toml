[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-compact"
version = "0.17.76"
description = "Session-scoped goal workspaces and persistent context for Claude Code."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "David Baroon" }]
license = { text = "MIT" }

[project.scripts]
hc-backup = "human_compact.cli:main"
hc = "human_compact.cli:hc_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
human_compact = ["assets/**/*", "assets/plugin/.claude-plugin/*", "assets/hc-ui-skill/*", "trajectory/web/*", "trajectory/web/static/*"]
