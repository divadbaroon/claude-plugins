name: windows-port

# Feasibility + smoke probes for native Windows support, run on a real
# windows-latest VM (there is no local Windows to test against). This is
# deliberately its own workflow, not a leg of the main test matrix: while
# the port is in progress some of these are expected to fail, and that must
# not turn the required checks red. Remove the informational continue-on-
# error steps as each capability lands.
on:
  push:
    branches: ['feat/windows-support', 'feat/windows-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-imports:
    # Make-or-break question 1: does the Python backend even import and run
    # on Windows? pip builds Scripts\hc.exe; if `hc --help` works, the wheel
    # is Windows-viable and Stage 2 is a port, not a rewrite.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ./hc pytest
      - run: hc --help
      # The cross-platform runtime primitives (private-file modes, detached
      # spawning, process-tree kill, pid liveness, image replacement) take their
      # Windows branch here, on a real Windows Python.
      - run: python -m pytest hc/tests -q

  node-unit-tests:
    # Question 2: do the CLI's own unit tests pass on Windows? They are
    # heavily dependency-injected, so failures here are real cross-platform
    # path/rename bugs in lib/, not environment noise.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: engelbart

  cross-compile-windows:
    # The release builds every target on ubuntu, so the Windows binary it ships
    # is cross-compiled, not native. Prove that path works before a release tag
    # depends on it: build both Windows artifacts on Linux and confirm they
    # and its checksum land where install.ps1 expects them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cross-compile the Windows binary on Linux
        run: scripts/build-binary.sh windows-x64 windows-arm64
        working-directory: engelbart
      - name: The release artifacts exist under their expected names
        run: test -f dist/engelbart-windows-x64.exe && test -f dist/engelbart-windows-x64.exe.sha256 && test -f dist/engelbart-windows-arm64.exe && test -f dist/engelbart-windows-arm64.exe.sha256
        working-directory: engelbart

  windows-binary:
    # Question 3: does Bun compile a Windows .exe of this CLI that actually
    # runs? --help returns before any platform gate, so it isolates "does the
    # binary run" from "is the installer ported yet".
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Build the Windows binary
        shell: bash
        run: scripts/build-binary.sh windows-x64
        working-directory: engelbart
      - name: It runs (--help)
        run: .\dist\engelbart-windows-x64.exe --help
        working-directory: engelbart
      # The installer now accepts win32: --dry-run resolves the Windows target
      # and verifies the bundled backend without building, so this is required.
      - name: install --dry-run
        run: .\dist\engelbart-windows-x64.exe install --dry-run
        working-directory: engelbart

  published-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: claude-plugins
      - uses: actions/checkout@v4
        with:
          repository: Mathetic-PBC/berkeley-research
          ref: main
          path: berkeley-research
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: berkeley-research
      - run: npx playwright install chromium
        working-directory: berkeley-research
      - name: Download the public Windows installer and select the released artifact
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'engelbart-public-install.ps1'
          Invoke-WebRequest https://berkeley.mathetic.com/engelbart/install.ps1 -OutFile $script
          "ENGELBART_INSTALL_SCRIPT=$script" >> $env:GITHUB_ENV
          "CLAUDE_PLUGINS_DIR=$env:GITHUB_WORKSPACE\claude-plugins" >> $env:GITHUB_ENV
          "BERKELEY_ROOT=$env:GITHUB_WORKSPACE\berkeley-research" >> $env:GITHUB_ENV
          "ENGELBART_RELEASE_HOOK=$env:GITHUB_WORKSPACE\claude-plugins\engelbart\test\release\windows-installer.cjs" >> $env:GITHUB_ENV
          "ENGELBART_INSTALLED_CHECK=$env:GITHUB_WORKSPACE\claude-plugins\engelbart\test\release\windows-installed.py" >> $env:GITHUB_ENV
          "EXPECTED_VERSION=0.19.33" >> $env:GITHUB_ENV
      - name: Retain native handoff assertions and replace only the installer entry point
        working-directory: berkeley-research
        shell: pwsh
        run: |
          $file = 'e2e/browser-cli-browser.spec.js'
          $original = Get-Content -Raw $file
          Set-Content -Encoding utf8 $file ('require(process.env.ENGELBART_RELEASE_HOOK);' + "`n" + $original)
      - name: Published exe install, real hooks, production browser, and Preview
        working-directory: berkeley-research
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          Get-Command Get-FileHash
          npm run test:e2e:round-trip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-windows-browser-report
          path: berkeley-research/playwright-report/
