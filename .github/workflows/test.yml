name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m py_compile compact-focus/compact_focus/*.py
      - run: python -m pip install ./compact-focus
      - run: compact-focus --version
      - run: python -m pip install ./hc
      - run: hc --help
      - run: python -m json.tool .claude-plugin/marketplace.json >/dev/null
      - run: python -m json.tool compact-focus/.claude-plugin/plugin.json >/dev/null
      - run: python -m json.tool compact-focus/hooks/hooks.json >/dev/null

  npm-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: human-compact
      - run: npm pack --ignore-scripts --dry-run
        working-directory: human-compact
