name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./hc
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python -m py_compile compact-focus/compact_focus/*.py
      - run: python -m pip install ./compact-focus
      - run: compact-focus --version
      - run: hc --help
      - run: python -m json.tool .claude-plugin/marketplace.json >/dev/null
      - run: python -m json.tool compact-focus/.claude-plugin/plugin.json >/dev/null
      - run: python -m json.tool compact-focus/hooks/hooks.json >/dev/null

  goal-page-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install ./hc playwright
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Exercise production resources and both goal-page renderers
        run: python -W error::ResourceWarning -m unittest test_web_starter test_preview_readiness test_workspace_models test_goal_api_credits test_workspace_clear_autostart test_dataset_upload test_dataset_collections test_todo_workspace test_todo_workspace_browser test_fast_workspace test_fast_workspace_browser test_agent_second_pass test_project_resources test_inactive_lifecycle test_goal_page test_goal_page_test_ui test_goal_page_telemetry -v
        env:
          PYTHONPATH: hc/src:tests
          ENGELBART_TELEMETRY_FORWARD: "0"
          ENGELBART_REQUIRE_BROWSER_TESTS: "1"

  npm-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: engelbart
      - run: npm pack --ignore-scripts --dry-run
        working-directory: engelbart
