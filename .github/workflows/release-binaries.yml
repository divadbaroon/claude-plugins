name: release-binaries

# The engelbart release button: an engelbart-v* tag builds the standalone
# binaries, attaches them with install.sh to the versioned release and the
# rolling engelbart-latest release (the stable URL install.sh downloads
# from), and publishes the npm package.
on:
  push:
    tags: ['engelbart-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # A tag that disagrees with package.json ships nothing: fail here,
      # before anything is built or published anywhere.
      - if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./engelbart/package.json').version")
          if [ "engelbart-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: npm test
        working-directory: engelbart
      - run: scripts/build-binary.sh darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl windows-x64
        working-directory: engelbart
      # The compiled binary must verify and plan from its embedded wheel alone.
      - run: engelbart/dist/engelbart-linux-x64 install --dry-run
      # This repo releases more than one product, so engelbart never claims
      # the repo-wide "Latest" and never relies on it: the versioned release
      # is the record, and the rolling engelbart-latest release is the stable
      # download URL that install.sh and the website point at.
      - if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --latest=false \
            --title "$GITHUB_REF_NAME" \
            --notes "Standalone engelbart binaries (no Node, npm, or Python required). Install with: curl -fsSL https://berkeley.mathetic.com/engelbart/install.sh | sh" \
            engelbart/dist/engelbart-* engelbart/scripts/install.sh engelbart/scripts/install.ps1
          gh release view engelbart-latest >/dev/null 2>&1 || \
            gh release create engelbart-latest \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "engelbart (latest)" \
              --notes "Rolling release: always the newest engelbart binaries. Versioned engelbart-v* releases are the record; this one exists so download URLs stay stable."
          gh release upload engelbart-latest --clobber \
            engelbart/dist/engelbart-* engelbart/scripts/install.sh engelbart/scripts/install.ps1
        env:
          GH_TOKEN: ${{ github.token }}
      # The tag is the single release button: it ships the binaries and the
      # npm package together, so the two channels cannot drift. A version
      # already on npm is skipped, so re-running a tag build stays safe.
      - if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "no NPM_TOKEN secret; npm publish left as a manual step"
          elif npm view "engelbart-cli@$version" version >/dev/null 2>&1; then
            echo "engelbart-cli@$version is already on npm; skipping publish"
          else
            npm publish --ignore-scripts
          fi
        working-directory: engelbart
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
