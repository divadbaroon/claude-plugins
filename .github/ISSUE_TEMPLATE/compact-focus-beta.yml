name: Compact Focus beta feedback
description: Report friction or loss from a real Claude Code or Codex compaction.
title: "[Compact Focus beta] "
body:
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Codex CLI
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the host, Compact Focus, Python, and operating-system versions.
      placeholder: "Claude Code 2.1.227; Compact Focus 0.20.7; Python 3.13; macOS 15"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Conversation setup
      description: Describe the kinds of decisions, reversals, and open questions present before compaction. Redact private transcript text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should the workflow have done?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact interaction step and whether you approved or canceled.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional screenshots, event names from `compact-focus status --json`, or stable demoted-evidence IDs. Do not paste a private transcript or state database.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private transcript text, credentials, and local state files from this report.
          required: true
